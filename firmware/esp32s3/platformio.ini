; LingoGlass AR S0 firmware
; Hardware baseline: ESPr Developer S3 Type-C (ESP32-S3-WROOM-1, 16MB flash, 8MB PSRAM)
; See docs/LingoGlass_AR_Display_Decision_Record.md for the locked S0 BOM.

[platformio]
default_envs = esp32s3
src_dir = src

[env:esp32s3]
; Hardware: Switch Science ESPr Developer S3 Type-C
;   - SoC: ESP32-S3-WROOM-1-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
;   - Decision Record: docs/LingoGlass_AR_Display_Decision_Record.md
;
; The base board `esp32-s3-devkitc-1` from the espressif32 platform defaults to
; N8 (8 MB flash, no PSRAM). We override flash size, partitions, and memory
; type below so the firmware can address the full 16 MB flash and 8 MB OPI
; PSRAM that the WROOM-1-N16R8 module provides. Verify at runtime via the
; banner printed by `printBoardInfo()`:
;   Flash bytes: 16777216
;   PSRAM bytes: 8388608
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 16 MB flash + 8 MB OPI PSRAM. arduino.memory_type=qio_opi tells the Arduino
; ESP32 core to compile with OPI PSRAM support; without this, ESP.getPsramSize()
; returns 0 even on N16R8 hardware.
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM

monitor_filters =
  esp32_exception_decoder
  time

lib_deps =
  h2zero/NimBLE-Arduino @ ^1.4.2
  olikraus/U8g2 @ ^2.35.30

; Phase A: device-side tests deferred. Pure-C++ ble_protocol tests run under [env:native].
test_ignore = *

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I lib/ble_protocol
  -I lib/subtitle_assembler
