; LingoGlass AR S0 firmware
; Hardware baseline: ESPr Developer S3 Type-C (ESP32-S3-WROOM-1, 16MB flash, 8MB PSRAM)
; See docs/LingoGlass_AR_Display_Decision_Record.md for the locked S0 BOM.

[platformio]
default_envs = esp32s3
src_dir = src

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_filters =
  esp32_exception_decoder
  time

lib_deps =
  h2zero/NimBLE-Arduino @ ^1.4.2
  olikraus/U8g2 @ ^2.35.30

; Phase A: device-side tests deferred. Pure-C++ ble_protocol tests run under [env:native].
test_ignore = *

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I lib/ble_protocol
