name: lingoglass_mobile
description: "LingoGlass AR sender app. S0 spike: scan, connect, send subtitle, log latency."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  flutter_sound: 9.2.13  # pinned: 9.30.x changed startRecorderToStream signature (Food -> Uint8List sink)
  http: ^1.2.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.0
  uuid: ^3.0.7  # 3.x to keep flutter_sound 9.2.13 happy (it requires uuid ^3.0.1)
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
