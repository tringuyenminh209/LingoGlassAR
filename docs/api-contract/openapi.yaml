openapi: 3.1.0
info:
  title: LingoGlass AR MVP API
  version: 1.0.0
  description: |
    Two path families coexist during S1:
    - `/v1/*` is the live backend implemented from S1 Day 1 onwards
      (FastAPI, audio translation gateway). This is what mobile hits
      starting Day 7.
    - `/api/v1/*` is the older REST surface drafted for the OCR /
      diagnostics / feedback flows. It is S2 scope; treat the spec
      below as forward-compatible documentation only. Path prefix
      harmonisation is deferred to S2.
servers:
  - url: https://api.lingoglass.online
paths:
  /v1/sessions:
    post:
      summary: Create a translation session
      description: |
        Allocates a new session_id, stores metadata in Redis with 1 h TTL,
        and returns the URL the mobile client should open the WebSocket on.
        Backend implementation lives in `backend/app/api/sessions.py` (S1 Day 3).
        On daily-spend-cap breach the response is 429 with code
        `daily_cap_exceeded`.
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreateResponse"
        "429":
          description: Daily spend cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFail"
  /v1/sessions/{id}/stream:
    get:
      summary: WebSocket — bidirectional translation stream (documented for completeness)
      description: |
        Upgrade-only endpoint. Wire frames are JSON objects validated
        against `docs/api-contract/ws-events.schema.json`. Direction is
        per-variant in the schema. Audio is PCM16 mono 16 kHz, framed
        ~100 ms per `audio.chunk`. End-of-utterance is signalled by an
        `audio.end` frame; the server then emits one or more
        `translation.partial` frames followed by exactly one
        `translation.final` frame. Errors are reported via `error`
        frames; non-retryable errors are followed by socket close 1011.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "404":
          $ref: "#/components/responses/BadRequest"
  /v1/translate:
    post:
      summary: Translate a block of text (S3 on-device OCR path)
      description: |
        One-shot text->text translation for the OCR flow. The phone recognises
        the source text on-device (ML Kit); only the recognised **text** is
        sent here — never image bytes. Reuses the OpenAI Realtime translator via
        `translate_text()`. Backend: `backend/app/api/translate.py` (S3 Day 2).
        On daily-spend-cap breach the response is 429 `daily_cap_exceeded`; an
        upstream translator failure is 502 `translator_error`. The request text
        and the translated text are never logged or persisted (privacy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
      responses:
        "200":
          description: Translation succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
        "429":
          description: Daily spend cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFail"
        "502":
          description: Upstream translator error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFail"
  /healthz:
    get:
      summary: Liveness probe
      description: |
        Returns `{status, version, redis}`. Implemented in
        `backend/app/api/health.py` (S1 Day 1). Mobile may poll this
        every 10 s to drive the Server-status chip in the UI.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/ocr:
    post:
      summary: "[SUPERSEDED] OCR and translate an uploaded image"
      deprecated: true
      description: |
        Superseded in S3 (2026-05-27) by on-device OCR. The S3 locked design
        runs ML Kit on the phone and uploads only the recognised text via
        `POST /v1/translate` — image bytes never leave the device. This
        image-upload variant is kept for historical reference only and must
        NOT be implemented: it would breach the privacy boundary (no image
        bytes cross the wire). See docs/codex/S3_TASKS.md.
      parameters:
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, source_lang, target_lang]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG/PNG/WebP, max 4 MB
                source_lang:
                  type: string
                  enum: [auto, ja, en, vi, ko, zh-CN]
                target_lang:
                  type: string
                  enum: [ja, en, vi, ko, zh-CN]
      responses:
        "200":
          description: OCR and translation succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/logs:
    post:
      summary: Upload latency/error events
      parameters:
        - in: header
          name: X-Device-Id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    $ref: "#/components/schemas/SessionEvent"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{id}/events:
    get:
      summary: Fetch diagnostic events for one session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session events
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [events]
                    properties:
                      events:
                        type: array
                        items:
                          $ref: "#/components/schemas/SessionEvent"
  /api/v1/sessions/{id}/purge:
    post:
      summary: Purge retained text for a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResponse"
  /api/v1/feedback:
    post:
      summary: Submit pilot feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "201":
          description: Feedback stored
  /api/v1/healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
components:
  schemas:
    SessionCreateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [sessionId, wsUrl, expiresAt]
          properties:
            sessionId:
              type: string
              format: uuid
            wsUrl:
              type: string
              format: uri
              description: Absolute wss:// URL the client should connect to next.
            expiresAt:
              type: string
              format: date-time
              description: When the session record expires from Redis (1 h after creation).
    HealthResponse:
      type: object
      required: [status, version, redis]
      properties:
        status:
          const: ok
        version:
          type: string
        redis:
          type: string
          enum: [up, down]
    TranslateRequest:
      type: object
      required: [sourceLang, targetLang, text]
      properties:
        deviceId:
          type: string
          format: uuid
        sourceLang:
          type: string
          enum: [ja, vi]
        targetLang:
          type: string
          enum: [ja, vi]
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Recognised source text (OCR'd on-device). Never logged.
    TranslateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [translatedText, durationMs]
          properties:
            translatedText:
              type: string
              description: The translation. Never logged or persisted.
            durationMs:
              type: integer
              minimum: 0
              description: Server-side translate leg duration (sub-metric of ocr_system_latency_ms).
    OcrResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [request_id, translated_text, ocr_text_length, duration_ms]
          properties:
            request_id:
              type: string
              format: uuid
            translated_text:
              type: string
              maxLength: 300
            ocr_text_length:
              type: integer
              minimum: 0
            duration_ms:
              type: integer
              minimum: 0
    SessionEvent:
      type: object
      required: [session_id, seq_no, event_type, created_at]
      properties:
        session_id:
          type: string
          format: uuid
        seq_no:
          type: integer
          minimum: 0
        event_type:
          type: string
          enum: [vad_start, vad_end, stt_done, translate_done, ble_sent, displayed, error]
        duration_ms:
          type: integer
          minimum: 0
        payload_text:
          type: string
          nullable: true
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
    PurgeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [purged_events]
          properties:
            purged_events:
              type: integer
              minimum: 0
    FeedbackRequest:
      type: object
      required: [session_id, rating, would_recommend]
      properties:
        tester_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        would_recommend:
          type: string
          enum: [yes, no, maybe]
        comment:
          type: string
          maxLength: 2000
    ApiFail:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFail"
    Unauthorized:
      description: Device not registered
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFail"
    PayloadTooLarge:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFail"
    RateLimited:
      description: Quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFail"

